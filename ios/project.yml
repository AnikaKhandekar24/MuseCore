name: MuseCore
options:
  bundleIdPrefix: com.studentportfolio
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  MuseCore:
    type: application
    platform: iOS
    sources:
      - MuseCore
    info:
      path: MuseCore/Info.plist
      properties:
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studentportfolio.MuseCore
        INFOPLIST_FILE: MuseCore/Info.plist
